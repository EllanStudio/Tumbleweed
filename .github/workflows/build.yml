name: Build Tumbleweed Paper Plugin

on:
  push:
    branches: [chore/minecraft-26.3, paper-port, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tumbleweed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Paper 26.3 plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Gradle launcher)
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JDK 25 (Paper 26.3 toolchain)
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        env:
          JAVA_HOME_21: ${{ steps.java21.outputs.path }}
          JAVA_HOME_25: ${{ steps.java25.outputs.path }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew -Dorg.gradle.java.installations.paths="$JAVA_HOME_25" --no-daemon --stacktrace clean build

      - name: Smoke-check plugin artifact
        run: |
          test -f build/libs/Tumbleweed-1.0.0.jar
          jar tf build/libs/Tumbleweed-1.0.0.jar | grep -q '^plugin.yml$'
          unzip -p build/libs/Tumbleweed-1.0.0.jar plugin.yml | grep -q "api-version: '26.3'"
          unzip -p build/libs/Tumbleweed-1.0.0.jar plugin.yml | grep -q 'net.tumbleweed.paper.TumbleweedPlugin'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tumbleweed-paper-plugin
          path: build/libs/Tumbleweed-1.0.0.jar
